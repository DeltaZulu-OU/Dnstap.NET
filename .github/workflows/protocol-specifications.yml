name: Protocol specifications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore tests/Dnstap.Tests/Dnstap.Tests.csproj
      - name: Build
        run: dotnet build tests/Dnstap.Tests/Dnstap.Tests.csproj --configuration Release --no-restore
      - name: Run MSTest specifications
        run: dotnet test tests/Dnstap.Tests/Dnstap.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=protocol-tests.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocol-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
