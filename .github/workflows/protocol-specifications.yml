name: Protocol specifications

on:
  workflow_call:
  push:
    branches:
      - '**'
    # A commit containing only Markdown changes does not require protocol tests.
    # Mixed Markdown and source/config changes still trigger all CI jobs.
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore tests/Dnstap.Tests/Dnstap.Tests.csproj --locked-mode
      - name: Build
        run: dotnet build tests/Dnstap.Tests/Dnstap.Tests.csproj --configuration Release --no-restore
      - name: Run MSTest specifications
        run: dotnet test tests/Dnstap.Tests/Dnstap.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=protocol-tests.trx" --results-directory TestResults
      - name: Build Tapper
        run: dotnet restore src/Tapper/Tapper.csproj --locked-mode && dotnet build src/Tapper/Tapper.csproj -c Release --no-restore
      - name: Validate solution build
        run: dotnet build src/Dnstap.NET.slnx -c Release --no-restore
      - name: Verify release version comparison
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v
      - name: Verify package source mapping decisions
        run: python3 -m unittest discover -s tests -p test_package_source_mapping.py -v
      - name: Smoke-test NuGet package creation
        run: |
          dotnet pack src/Dnstap/Dnstap.csproj --configuration Release --no-build --no-restore --output "${{ runner.temp }}/package-smoke" /p:RepositoryCommit="${{ github.sha }}"
          python3 -c 'import glob,os,subprocess; paths=glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "package-smoke", "Dnstap.NET.*.nupkg")); assert len(paths)==1, "Expected exactly one package"; subprocess.run(["python3",".github/scripts/verify-nupkg.py",paths[0]],check=True)'
      - name: Configure exclusive package source mapping for the local release candidate
        run: python3 .github/scripts/configure-nuget-sources.py "${{ runner.temp }}/consumer.nuget.config" local "${{ runner.temp }}/package-smoke"
      - name: Restore external package consumer from local NuGet artifact
        run: dotnet restore tests/PackageConsumer/PackageConsumer.csproj --configfile "${{ runner.temp }}/consumer.nuget.config" --packages "${{ runner.temp }}/package-consumer-cache" --no-http-cache
      - name: Run external package consumer
        run: dotnet run --project tests/PackageConsumer/PackageConsumer.csproj --configuration Release --no-restore
      - name: Record tested NuGet package digest
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/package-smoke"
          sha256sum Dnstap.NET.*.nupkg > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Preserve tested NuGet release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-nuget-package
          path: |
            ${{ runner.temp }}/package-smoke/*.nupkg
            ${{ runner.temp }}/package-smoke/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Exercise public library API through Tapper
        run: dotnet run --project src/Tapper/Tapper.csproj -c Release --no-build -- file --output "${{ runner.temp }}/tapper.fstrm" --count 3
      - name: Upload Tapper file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tapper-file
          path: ${{ runner.temp }}/tapper.fstrm
          if-no-files-found: warn
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocol-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  release-artifact-smoke:
    needs: protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download tested release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-nuget-package
          path: ${{ runner.temp }}/candidate
      - name: Verify package and digest after artifact transfer
        shell: bash
        run: |
          set -euo pipefail
          (cd "${{ runner.temp }}/candidate" && sha256sum --check SHA256SUMS && test "$(wc -l < SHA256SUMS)" -eq 1)
          python3 .github/scripts/verify-nupkg.py "${{ runner.temp }}/candidate/Dnstap.NET.$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("src/Directory.Build.props").getroot().find(".//Version").text)').nupkg"

  external-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Set up pinned Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.25.6'
      - name: Build Tapper
        run: dotnet restore src/Tapper/Tapper.csproj --locked-mode && dotnet build src/Tapper/Tapper.csproj -c Release --no-restore
      - name: Install pinned independent Go dnstap reader
        run: GOBIN="${{ runner.temp }}/dnstap-tools" go install github.com/dnstap/golang-dnstap/dnstap@ebb538e7d351a58861a8f348491828214a1d8db2
      - name: Validate Tapper output in independent implementation
        run: |
          set -euo pipefail
          dotnet run --project src/Tapper/Tapper.csproj -c Release --no-build -- file --output "${{ runner.temp }}/tapper.fstrm" --count 3
          "${{ runner.temp }}/dnstap-tools/dnstap" -j -r "${{ runner.temp }}/tapper.fstrm" > "${{ runner.temp }}/tapper.jsonl"
          jq -s -e 'length == 3 and all(.[]; .type == "MESSAGE" and .identity == "tapper" and .message.type == "CLIENT_QUERY" and .message.socket_protocol == "UDP" and .message.query_address == "192.0.2.10" and .message.response_port == 53 and (.message.query_message | contains("example.com.")))' "${{ runner.temp }}/tapper.jsonl"
      - name: Validate Tapper duplex output in independent Go receiver
        run: |
          set -euo pipefail
          "${{ runner.temp }}/dnstap-tools/dnstap" -j -l 127.0.0.1:16053 > "${{ runner.temp }}/socket.jsonl" 2> "${{ runner.temp }}/socket.stderr" &
          reader=$!
          trap 'kill "$reader" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..100}; do
            if ss -ltn | grep -qE ':16053[[:space:]]'; then ready=1; break; fi
            kill -0 "$reader" || { cat "${{ runner.temp }}/socket.stderr"; exit 1; }
            sleep 0.1
          done
          [[ "$ready" -eq 1 ]]
          dotnet run --project src/Tapper/Tapper.csproj -c Release --no-build -- tcp --host 127.0.0.1 --port 16053 --count 3
          for i in {1..100}; do
            if [[ "$(wc -l < "${{ runner.temp }}/socket.jsonl")" -ge 3 ]]; then break; fi
            sleep 0.1
          done
          jq -s -e 'length == 3 and all(.[]; .type == "MESSAGE" and .identity == "tapper" and .message.type == "CLIENT_QUERY" and .message.socket_protocol == "UDP" and .message.query_address == "192.0.2.10" and .message.response_port == 53 and (.message.query_message | contains("example.com.")))' "${{ runner.temp }}/socket.jsonl"
      - name: Upload independent decode evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-interop
          path: |
            ${{ runner.temp }}/tapper.fstrm
            ${{ runner.temp }}/tapper.jsonl
            ${{ runner.temp }}/socket.jsonl
            ${{ runner.temp }}/socket.stderr
          if-no-files-found: warn

  dns-collector-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build Tapper
        run: dotnet restore src/Tapper/Tapper.csproj --locked-mode && dotnet build src/Tapper/Tapper.csproj -c Release --no-restore
      - name: Download and verify DNS-collector v3.3.7
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/DNS-collector_3.3.7_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/dmachard/DNS-collector/releases/download/v3.3.7/DNS-collector_3.3.7_linux_amd64.tar.gz
          echo "7f16a995e3be6d7bb46974722a3f1336cc589fbfff2c2c3c9c57c0b4cbedcbbe  $archive" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/collector-bin"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/collector-bin"
          binary="$(find "${RUNNER_TEMP}/collector-bin" -type f -name dnscollector -print -quit)"
          [[ -n "$binary" ]] || { echo "Collector executable not found" >&2; exit 1; }
          chmod +x "$binary"
          echo "DNS_COLLECTOR_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Validate Tapper with DNS-collector file and TCP inputs
        run: bash .github/interop/check-dns-collector.sh "$RUNNER_TEMP" "$DNS_COLLECTOR_BINARY"
      - name: Upload DNS-collector interoperability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dns-collector-evidence
          path: |
            ${{ runner.temp }}/collector.log
            ${{ runner.temp }}/config-check.log
            ${{ runner.temp }}/tcp.jsonl
            ${{ runner.temp }}/file.jsonl
            ${{ runner.temp }}/tap-watch/capture.fstrm
          if-no-files-found: warn

  fs021-libfstrm-tcp-interop:
    name: FS-021/FS-023 libfstrm capture (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: tcp-explicit
            port: 16061
          - target: tcp-no-complete
            port: 16062
          - target: unix-explicit
            port: 0
          - target: unix-no-complete
            port: 0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Set up pinned Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.25.6'
      - name: Install libfstrm build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config libevent-dev build-essential
      - name: Build pinned libfstrm v0.6.1 from source
        shell: bash
        run: |
          set -euo pipefail
          readonly FSTRM_REF=v0.6.1
          readonly FSTRM_SHA=1d6e11d750dfa8d15419814dfe0aa86d80000741
          git clone --depth 1 --branch "$FSTRM_REF" https://github.com/farsightsec/fstrm.git "$RUNNER_TEMP/fstrm-src"
          test "$(git -C "$RUNNER_TEMP/fstrm-src" rev-parse HEAD)" = "$FSTRM_SHA"
          cd "$RUNNER_TEMP/fstrm-src"
          ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/fstrm-install"
          make -j"$(nproc)"
          make check
          make install
          echo "FSTRM_CAPTURE=$RUNNER_TEMP/fstrm-install/bin/fstrm_capture" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/fstrm-install/lib" >> "$GITHUB_ENV"
      - name: Build Tapper from locked dependencies
        run: dotnet restore src/Tapper/Tapper.csproj --locked-mode && dotnet build src/Tapper/Tapper.csproj -c Release --no-restore
      - name: Install pinned independent Go dnstap reader
        run: GOBIN="$RUNNER_TEMP/dnstap-tools" go install github.com/dnstap/golang-dnstap/dnstap@ebb538e7d351a58861a8f348491828214a1d8db2
      - name: FS-021/FS-023 receiver, completion and negative control
        shell: bash
        run: bash .github/interop/fstrm/run-target.sh "${{ matrix.target }}" "$FSTRM_CAPTURE" "$RUNNER_TEMP/dnstap-tools/dnstap" "$(command -v dotnet)" "$RUNNER_TEMP/fstrm-evidence" "${{ matrix.port }}"
      - name: Upload FS-021 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fstrm-${{ matrix.target }}-evidence
          path: ${{ runner.temp }}/fstrm-evidence/
          if-no-files-found: error
          retention-days: 90

  fs022-file-reader-interop:
    name: FS-022 file reader (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fstrm-dump, bind-dnstap-read, knot-kdig]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Set up pinned Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: '1.25.6'
      - name: Install BIND and Knot prerequisites from Ubuntu 24.04
        if: matrix.target != 'fstrm-dump'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bind9-dnsutils knot-dnsutils python3-yaml
      - name: Install libfstrm build prerequisites
        if: matrix.target == 'fstrm-dump'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config libevent-dev build-essential
      - name: Build libfstrm v0.6.1 at exact commit
        if: matrix.target == 'fstrm-dump'
        shell: bash
        run: |
          set -euo pipefail
          readonly FSTRM_SHA=1d6e11d750dfa8d15419814dfe0aa86d80000741
          git clone --depth 1 --branch v0.6.1 https://github.com/farsightsec/fstrm.git "$RUNNER_TEMP/fstrm-src"
          test "$(git -C "$RUNNER_TEMP/fstrm-src" rev-parse HEAD)" = "$FSTRM_SHA"
          cd "$RUNNER_TEMP/fstrm-src"
          ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/fstrm-install"
          make -j"$(nproc)"
          make check
          make install
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/fstrm-install/lib" >> "$GITHUB_ENV"
      - name: Build BIND 9.18.39 dnstap-read from pinned source
        if: matrix.target == 'bind-dnstap-read'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config make gcc g++ libuv1-dev libssl-dev libprotobuf-c-dev protobuf-c-compiler libfstrm-dev
          readonly BIND_REF=v9.18.39
          readonly BIND_SHA=737584125e6b078481e176e814970f560e115f1a
          git clone --depth 1 --branch "$BIND_REF" https://github.com/isc-projects/bind9.git "$RUNNER_TEMP/bind9"
          test "$(git -C "$RUNNER_TEMP/bind9" rev-parse HEAD)" = "$BIND_SHA"
          cd "$RUNNER_TEMP/bind9"
          autoreconf -fi
          ./configure --enable-dnstap --disable-doh --without-lmdb --without-json-c --without-libxml2 --without-gssapi --disable-linux-caps
          make -j"$(nproc)" -C lib
          make -j"$(nproc)" -C bin/tools dnstap-read
          test -x bin/tools/dnstap-read
          echo "BIND_DNSTAP_READ=$RUNNER_TEMP/bind9/bin/tools/dnstap-read" >> "$GITHUB_ENV"
      - name: Build Tapper from locked dependencies
        run: dotnet restore src/Tapper/Tapper.csproj --locked-mode && dotnet build src/Tapper/Tapper.csproj -c Release --no-restore
      - name: Install pinned independent Go dnstap reader
        run: GOBIN="$RUNNER_TEMP/dnstap-tools" go install github.com/dnstap/golang-dnstap/dnstap@ebb538e7d351a58861a8f348491828214a1d8db2
      - name: FS-022 verify reader and record truncated-file behavior
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            fstrm-dump) reader="$RUNNER_TEMP/fstrm-install/bin/fstrm_dump" ;;
            bind-dnstap-read) reader="$BIND_DNSTAP_READ" ;;
            knot-kdig) reader="$(command -v kdig)" ;;
          esac
          bash .github/interop/fstrm/run-file-reader.sh "${{ matrix.target }}" "$reader" "$RUNNER_TEMP/dnstap-tools/dnstap" "$(command -v dotnet)" "$RUNNER_TEMP/file-reader-evidence"
      - name: Upload FS-022 file reader evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-reader-${{ matrix.target }}-evidence
          path: ${{ runner.temp }}/file-reader-evidence/
          if-no-files-found: error
          retention-days: 90

  fs024-unbound-interop:
    name: FS-024 Unbound receiver (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: tcp-explicit
            port: 16071
          - target: tcp-no-complete
            port: 16072
          - target: unix-explicit
            port: 0
          - target: unix-no-complete
            port: 0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install Unbound build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev libexpat1-dev libevent-dev libprotobuf-c-dev protobuf-c-compiler libfstrm-dev
      - name: Build SHA-256-pinned Unbound 1.26.2 dnstap receiver
        shell: bash
        run: |
          set -euo pipefail
          version=1.26.2
          sha256=d8ee7aa6bbb3ff1be7d9e57637d0d0ec2f18273a8efff1a0afe2c665858b96f7
          archive="$RUNNER_TEMP/unbound-$version.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://nlnetlabs.nl/downloads/unbound/unbound-$version.tar.gz"
          echo "$sha256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/unbound-$version"
          ./configure --enable-dnstap --without-pyunbound --without-pythonmodule
          make -j"$(nproc)" unbound-dnstap-socket
          test -x unbound-dnstap-socket
          ./unbound-dnstap-socket -h > "$RUNNER_TEMP/unbound-help.txt" 2>&1 || test "$?" -eq 1
          grep -q -- '-s <serverip' "$RUNNER_TEMP/unbound-help.txt"
          grep -q -- '-u <socketpath' "$RUNNER_TEMP/unbound-help.txt"
          echo "UNBOUND_DNSTAP_SOCKET=$RUNNER_TEMP/unbound-$version/unbound-dnstap-socket" >> "$GITHUB_ENV"
          printf '%s\n' "$version" "$sha256" > "$RUNNER_TEMP/unbound-source.txt"
      - name: Build Tapper from locked dependencies
        run: dotnet restore src/Tapper/Tapper.csproj --locked-mode && dotnet build src/Tapper/Tapper.csproj -c Release --no-restore
      - name: FS-024 validate Unbound receiver
        shell: bash
        run: bash .github/interop/unbound/run-target.sh "${{ matrix.target }}" "$UNBOUND_DNSTAP_SOCKET" "$(command -v dotnet)" "$RUNNER_TEMP/unbound-evidence" "${{ matrix.port }}"
      - name: Upload Unbound interoperability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unbound-${{ matrix.target }}-evidence
          path: |
            ${{ runner.temp }}/unbound-evidence/
            ${{ runner.temp }}/unbound-source.txt
            ${{ runner.temp }}/unbound-help.txt
          if-no-files-found: warn
          retention-days: 90
