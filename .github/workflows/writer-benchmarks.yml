name: Writer benchmark comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore benchmark
        run: dotnet restore benchmarks/Dnstap.Benchmarks/Dnstap.Benchmarks.csproj
      - name: Run short allocation/throughput sample
        run: dotnet run -c Release --project benchmarks/Dnstap.Benchmarks/Dnstap.Benchmarks.csproj -- --filter '*' --job short --warmupCount 1 --iterationCount 3 --launchCount 1 --artifacts ./BenchmarkDotNet.Artifacts
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: writer-benchmark-evidence
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
