name: Remove merged experimental branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only the verified merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r branch expected; do
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Ref changed: $branch ($actual != $expected)"
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted $branch"
          done <<'BRANCHES'
          fix/file-reader-buffer-management 2cb6d5440fda00df225941efdfa314108ad8f3cc
          fix/file-reader-direct-buffer-sizing 3ace64e76eb2027462108a48a2e0a3867bb10de8
          test/framestreams-protocol-specifications 2cb6d5440fda00df225941efdfa314108ad8f3cc
          BRANCHES
      - name: Verify only main remains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches="$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '[.[].name]')"
          echo "$branches"
          [[ "$branches" == '["main"]' ]]
