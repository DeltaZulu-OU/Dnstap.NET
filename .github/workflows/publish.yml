name: Publish NuGet package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnstap-publish
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Allow release only from main
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "Select main when manually dispatching this publishing workflow." >&2
            exit 1
          fi
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: Read release version from src/Directory.Build.props
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as E; root=E.parse("src/Directory.Build.props").getroot(); v=[e.text.strip() for e in root.iter("Version") if e.text and e.text.strip()]; assert len(v)==1, "Expected exactly one Version element"; print(v[0])')"
          python3 .github/scripts/check-release-version.py "$version"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  protocol-conformance:
    needs: validate-release
    uses: ./.github/workflows/protocol-specifications.yml
    permissions:
      contents: read

  publish:
    needs: [validate-release, protocol-conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      PACKAGE_VERSION: ${{ needs.validate-release.outputs.package_version }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      PACKAGE_OUTPUT: ${{ github.workspace }}/artifacts/packages
      GITHUB_NUGET_SOURCE: https://nuget.pkg.github.com/DeltaZulu-OU/index.json
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Recheck version on publishing runner
        run: python3 .github/scripts/check-release-version.py "$PACKAGE_VERSION"
      - name: Download tested NuGet release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-nuget-package
          path: ${{ env.PACKAGE_OUTPUT }}
      - name: Verify tested package digest and metadata
        shell: bash
        run: |
          set -euo pipefail
          (cd "$PACKAGE_OUTPUT" && sha256sum --check SHA256SUMS && test "$(wc -l < SHA256SUMS)" -eq 1)
          python3 .github/scripts/verify-nupkg.py "$PACKAGE_OUTPUT/Dnstap.NET.$PACKAGE_VERSION.nupkg"
      - name: Configure authenticated NuGet feed with package source mapping
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/github-packages-nuget.config"
          python3 .github/scripts/configure-nuget-sources.py "$config" github "$GITHUB_NUGET_SOURCE"
          dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile "$config"
          echo "RELEASE_NUGET_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Push tested package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # A duplicate is acceptable only if the next step verifies identical bytes
          # retrieved directly from the registry with no preexisting package cache.
          dotnet nuget push "$PACKAGE_OUTPUT/Dnstap.NET.$PACKAGE_VERSION.nupkg" --api-key "$GITHUB_TOKEN" --configfile "$RELEASE_NUGET_CONFIG" --source github --skip-duplicate
      - name: Verify published package from a clean registry-backed restore
        shell: bash
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="$RUNNER_TEMP/registry-verification-cache"
          dotnet restore tests/PackageConsumer/PackageConsumer.csproj --configfile "$RELEASE_NUGET_CONFIG" --packages "$NUGET_PACKAGES" --no-http-cache
          downloaded="$NUGET_PACKAGES/dnstap.net/$PACKAGE_VERSION/dnstap.net.$PACKAGE_VERSION.nupkg"
          python3 .github/scripts/release-artifact.py compare "$PACKAGE_OUTPUT/Dnstap.NET.$PACKAGE_VERSION.nupkg" "$downloaded"
          dotnet run --project tests/PackageConsumer/PackageConsumer.csproj --configuration Release --no-restore
      - name: Create or verify release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          else
            git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
